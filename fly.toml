# Always-on HydraShield demo. HydraDB + API + UI in one Fly machine.
# Public URL: https://rhapy01-hydrashield.fly.dev
app = "rhapy01-hydrashield"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "8m"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/"

[mounts]
  source = "hydradb_data"
  destination = "/data"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4096mb"

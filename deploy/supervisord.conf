[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[program:hydradb]
command=/usr/local/bin/graph-node
directory=/tmp
autostart=true
autorestart=true
startsecs=8
startretries=20
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=CLOUD_PROVIDER="local",LOCAL_PATH="/data/store",GRAPH_NAMESPACE="default",GRAPH_ID="default",GRAPH_CELL_ID="cell-0",GRAPH_CELLS="cell-0",GRAPH_NODE_ID="node-0",GRAPH_BOLT_NODE_ADDRESSES="node-0=127.0.0.1:7687",GRAPH_ADVERTISED_BOLT_ADDR="127.0.0.1:7687",GRAPH_HTTP_ADDR="0.0.0.0:8443",GRAPH_BOLT_ADDR="0.0.0.0:7687",GRAPH_ADMIN_ADDR="0.0.0.0:9090",GRAPH_DATA_CACHE_DIR="/data/cache",GRAPH_AUTH_TOKEN_FILE="/data/auth-token",GRAPH_ALLOW_PLAINTEXT="true",RUST_MIN_STACK="33554432",RUST_LOG="info"

[program:api]
command=/opt/venv/bin/uvicorn hydrashield.main:app --host 127.0.0.1 --port 8000
directory=/app
autostart=true
autorestart=true
startsecs=3
startretries=40
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
environment=PYTHONPATH="/app",HYDRADB_URL="http://127.0.0.1:8443",HYDRADB_TOKEN="local-development-token-32-bytes",HYDRADB_NAMESPACE="default",HYDRADB_GRAPH="default",HYDRADB_CELL="cell-0",DATA_DIR="/app/data",AUTO_INGEST="true",HYDRADB_TIMEOUT="60",HYDRADB_RETRIES="8"

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=1
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

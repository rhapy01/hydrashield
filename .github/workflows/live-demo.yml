name: Live demo

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: live-demo
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Start HydraDB + API + UI
        run: |
          docker compose pull hydradb
          docker compose up -d --build
          echo "Waiting for HydraDB /readyz..."
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9090/readyz >/dev/null 2>&1; then
              echo "HydraDB ready"
              break
            fi
            sleep 4
          done
          echo "HydraDB write probe:"
          curl -sS -w "\ncreate_http %{http_code}\n" http://127.0.0.1:8443/v1/graphs/default/query \
            -H "Authorization: Bearer local-development-token-32-bytes" \
            -H "X-Graph-Namespace: default" \
            -H "Content-Type: application/json" \
            --data '{"cell_id":"cell-0","query":"CREATE (a {id: 1})-[:FOLLOWS]->(b {id: 2})"}' \
            | tee /tmp/hydradb-write.json || true
          echo "Waiting for API health..."
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "API up"
              break
            fi
            sleep 4
          done
          curl -fsS -X POST http://127.0.0.1:8000/api/ingest || true
          curl -fsS http://127.0.0.1:8000/api/health || true
          docker compose ps
          echo "HydraDB logs (tail):"
          docker compose logs --tail=80 hydradb || true

      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Open public tunnel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! command -v cloudflared >/dev/null 2>&1; then
            curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
            chmod +x cloudflared
            sudo mv cloudflared /usr/local/bin/cloudflared
          fi
          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:5173 > /tmp/cloudflared.log 2>&1 &
          echo $! > /tmp/cloudflared.pid
          URL=""
          for i in $(seq 1 30); do
            URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if [ -n "$URL" ]; then
              break
            fi
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Tunnel URL not found"
            cat /tmp/cloudflared.log
            exit 1
          fi
          echo "LIVE_URL=$URL" >> "$GITHUB_ENV"
          echo "$URL" > live-url.txt
          echo "## HydraShield live demo" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Open:** $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "HydraDB is running in this job. Click Ingest + analyze if the graph is empty." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This URL stays up until the workflow is cancelled or times out (90 minutes)." >> "$GITHUB_STEP_SUMMARY"
          echo "Public demo URL: $URL"
          echo "::notice title=HydraShield live demo::$URL"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/comments" \
            -f body="$(printf '**Live demo (HydraDB):** %s\n\nOpen this URL to test HydraShield. It stays up until this workflow is cancelled or times out (~90 minutes). Re-run **Actions → Live demo** for a new URL.\n\nWrite probe:\n```\n%s\n```' "$URL" "$(cat /tmp/hydradb-write.json 2>/dev/null | head -c 1500)")" \
            || echo "Commit comment failed (demo is still up)"

      - name: Upload demo URL
        uses: actions/upload-artifact@v4
        with:
          name: live-demo-url
          path: live-url.txt

      - name: Keep demo alive
        run: |
          echo "Live at $LIVE_URL"
          # Re-print every 5 minutes so it is easy to find in the log.
          for i in $(seq 1 16); do
            echo "[$i/16] still live: $LIVE_URL"
            curl -fsS -o /dev/null -w "ui %{http_code}\n" "$LIVE_URL" || true
            sleep 300
          done
